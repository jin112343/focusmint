<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusMint · 管理</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body>
<main id="login"><div class="brand">FOCUS. BREATHE. RESET.</div><h1>FocusMint <span>管理</span></h1><p>お問い合わせと返信。</p><form id="login-form"><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form></main>
<div id="app" hidden><header><div><small>FOCUSMINT / ADMIN</small><h1>こんにちは。</h1></div><nav><button id="notify-test" class="quiet">通知テスト</button><button id="logout" class="quiet">ログアウト</button></nav></header>
<section id="inbox"><aside><div class="list-heading"><h2>受信箱</h2><button id="refresh" class="quiet">更新</button></div><div id="threads"></div></aside><article><div id="chat-heading">左からお問い合わせを選んでください。</div><div id="messages" aria-live="polite"></div><form id="reply-form" hidden><div id="photo-preview"></div><textarea id="reply" maxlength="2000" placeholder="返信を入力" rows="2"></textarea><div class="compose-actions"><label class="photo-label">＋ 写真<input type="file" id="photo" accept="image/*"></label><button>返信する</button></div></form></article></section>
</div><div id="notice" role="status" hidden></div></body></html>
